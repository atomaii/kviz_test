<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тест NOVA: сколько работы отдать системе</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: одна колонка, как сторис — шапка с логотипом, карточка вопроса из стекла, чёрные кнопки, синий только на итоговой цифре */
:root{
  --bg:#f1f1ee; --bg2:#e6e7ea; --card:rgba(255,255,255,.78); --card-solid:#ffffff; --line:#dcdcd6;
  --fg:#121316; --mute:#6c6d70; --soft:#9a9b9e;
  --ink:#111216; --ink-fg:#ffffff;
  --accent:#2350ff; --accent2:#4fbfff;
  --sel:#111216; --sel-fg:#ffffff;
  --display:"Onest", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f12; --bg2:#16181d; --card:rgba(255,255,255,.06); --card-solid:#17191e; --line:#2a2c32;
  --fg:#f2f2f0; --mute:#a3a4a8; --soft:#76777c;
  --ink:#f2f2f0; --ink-fg:#0e0f12; --accent:#5b7dff; --accent2:#6fd0ff; --sel:#f2f2f0; --sel-fg:#0e0f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12; --bg2:#16181d; --card:rgba(255,255,255,.06); --card-solid:#17191e; --line:#2a2c32;
  --fg:#f2f2f0; --mute:#a3a4a8; --soft:#76777c;
  --ink:#f2f2f0; --ink-fg:#0e0f12; --accent:#5b7dff; --accent2:#6fd0ff; --sel:#f2f2f0; --sel-fg:#0e0f12; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:22px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:flex-start;gap:2px;font-weight:700;font-size:22px;letter-spacing:-.045em}
.logo svg{width:8px;height:8px;margin-top:3px;fill:currentColor}
.tag{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;box-shadow:inset 0 0 0 1px var(--line);padding:26px 22px}
h1{font-size:clamp(32px,8.5vw,44px);line-height:1.04;font-weight:500;letter-spacing:-.04em;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,6.4vw,30px);line-height:1.12;font-weight:500;letter-spacing:-.03em;margin:0;text-wrap:balance}
p{margin:0;line-height:1.45;font-size:16px}
.mute{color:var(--mute)}
.small{font-size:13px;color:var(--soft)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-size:17px;font-weight:500;border-radius:999px;padding:17px 22px;background:var(--ink);color:var(--ink-fg);width:100%;transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;border:0;border-radius:18px;padding:16px 18px;background:var(--card-solid);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line);display:flex;gap:14px;align-items:center;font-size:16px;line-height:1.3;transition:background .15s,box-shadow .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:13px;color:var(--soft)}
.opt .t{min-width:0}
.opt .t small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.opt[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);box-shadow:none}
.opt[aria-pressed="true"] .k{background:var(--sel-fg);color:var(--sel);box-shadow:none}
.opt[aria-pressed="true"] .t small{color:inherit;opacity:.7}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px;transition:width .3s ease}
.nav{display:flex;gap:10px}
.nav .btn.ghost{width:auto;padding-inline:22px}
.who{display:grid;gap:10px}
.big{font-size:clamp(64px,20vw,96px);line-height:.95;font-weight:600;letter-spacing:-.06em;font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card-solid);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.stat b{display:block;font-size:clamp(20px,5.6vw,26px);white-space:nowrap;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:0}
.item{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item .n{flex:none;font-size:13px;color:var(--soft);width:22px;padding-top:3px;font-variant-numeric:tabular-nums}
.item b{font-weight:500;display:block;font-size:17px}
.item p{font-size:14px;color:var(--mute);margin-top:4px}
.cta{background:var(--ink);color:var(--ink-fg);border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.cta .word{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink-fg);color:var(--ink);border-radius:999px;padding:8px 8px 8px 20px;font-weight:600;font-size:20px;letter-spacing:.02em}
.cta .word button{appearance:none;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:500;letter-spacing:0;border-radius:999px;padding:12px 16px;background:var(--ink);color:var(--ink-fg)}
.cta a{color:inherit;font-size:15px;opacity:.8}
.fade{animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
footer{margin-top:auto;text-align:center}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
// Где искать NOVA (поменять ник здесь, если он другой)
const IG_NICK = "nova_avtomatizach";
const WORD = "ХОЧУ";
const STAR = '<svg viewBox="0 0 20 20"><path d="M10 0C10.8 6.5 13.5 9.2 20 10C13.5 10.8 10.8 13.5 10 20C9.2 13.5 6.5 10.8 0 10C6.5 9.2 9.2 6.5 10 0Z"/></svg>';

// h — часов в неделю, которые можно отдать системе; tip — какая автоматизация закрывает эту рутину
const Q = {
 self:{ label:"для себя", rateQ:{t:"Сколько примерно стоит час вашего времени?",o:[["до 500 ₽",400],["500–1 000 ₽",800],["1 000–2 000 ₽",1500],["больше 2 000 ₽",2500]]},
  qs:[
   {t:"Сколько времени в день уходит на переписки и ответы на одни и те же вопросы?",o:[["почти нет",0],["около 15 минут",1.5],["около получаса",3],["час и больше",6]],tip:["Бот отвечает на частые вопросы за вас","Ответы на типовые вопросы, записи и напоминания — без вашего участия"]},
   {t:"Ведёте учёт денег, заказов или задач в таблицах вручную?",o:[["нет",0],["немного, раз в неделю",1],["пару часов в неделю",2.5],["постоянно, это съедает время",5]],tip:["Таблица заполняется сама","Данные из заявок, оплат и сообщений попадают в таблицу автоматически"]},
   {t:"Как часто переносите данные из одного места в другое: из почты в таблицу, из чата в заметки?",o:[["почти никогда",0],["пару раз в неделю",1],["каждый день",3],["несколько раз в день",5]],tip:["Сервисы связаны между собой","Почта, мессенджеры и таблицы передают данные друг другу сами"]},
   {t:"Напоминания и сроки держите в голове?",o:[["нет, всё в календаре",0],["частично",0.5],["да, иногда что-то забываю",1.5],["да, и регулярно забываю",3]],tip:["Напоминания приходят сами","Сроки, оплаты и встречи — уведомлением в Telegram вовремя"]},
   {t:"Счета, документы и отчёты собираете вручную?",o:[["нет",0],["редко",0.5],["каждую неделю",2],["много и часто",4]],tip:["Документы по шаблону за секунды","Счета, акты и отчёты собираются из данных без копирования"]},
  ]},
 blog:{ label:"блог или эксперт", rateQ:{t:"Сколько стоит час вашего времени (консультация, работа с клиентом)?",o:[["до 1 000 ₽",800],["1 000–3 000 ₽",2000],["3 000–5 000 ₽",4000],["больше 5 000 ₽",6000]]},
  qs:[
   {t:"Сколько сообщений приходит в директ или личку в день?",o:[["до 10",0.5],["10–30",2],["30–100",5],["больше 100",9]],tip:["Директ разбирается автоматически","Бот отвечает, отбирает горячие заявки и передаёт их вам"]},
   {t:"Часто отвечаете на одни и те же вопросы: цена, как купить, где ссылка?",o:[["редко",0],["иногда",1],["каждый день",3],["это половина переписки",5]],tip:["Ответы по кодовым словам","Цены, ссылки и материалы уходят сами по кодовому слову"]},
   {t:"Как собираете заявки на консультации или продукт?",o:[["форма или CRM, всё уже автоматически",0],["таблица, заполняю сама/сам",2],["в переписке, без системы",3.5],["часть заявок теряется",5]],tip:["Заявки собираются в одном месте","Каждая заявка попадает в таблицу или CRM со статусом, ничего не теряется"]},
   {t:"Материалы, ссылки и лид-магниты выдаёте вручную?",o:[["нет, всё автоматически",0],["иногда",0.5],["регулярно",2],["постоянно",3.5]],tip:["Выдача материалов без вас","Гайды, ссылки и записи эфиров уходят подписчику сразу после запроса"]},
   {t:"Сколько времени в неделю на рутину вокруг контента: перенос по площадкам, статистика, сводки?",o:[["почти нет",0],["около часа",1],["2–4 часа",3],["больше 4 часов",5]],tip:["Кросспостинг и статистика сами","Публикации расходятся по площадкам, а сводка по цифрам приходит в Telegram"]},
  ]},
 biz:{ label:"бизнес с сотрудниками", rateQ:{t:"Сколько в среднем стоит час работы сотрудника, который ведёт учёт и бумаги?",o:[["до 300 ₽",250],["300–500 ₽",400],["500–800 ₽",650],["больше 800 ₽",1000]]},
  qs:[
   {t:"Сколько у вас сотрудников?",o:[["до 5",1],["5–20",1.5],["20–50",2.2],["больше 50",3]],mult:true},
   {t:"Как ведёте смены и учёт рабочего времени?",o:[["уже в системе",0],["в Excel",2],["в чате и на бумаге",3.5],["никак, на доверии",4]],tip:["Учёт смен по QR","Сотрудник отмечается на точке, часы и опоздания считаются сами"]},
   {t:"Сколько времени в неделю уходит на расчёт зарплат, премий и штрафов?",o:[["меньше часа",0.5],["1–3 часа",2],["3–8 часов",5],["больше 8 часов",9]],tip:["Зарплата считается сама","Ставки, часы, премии и штрафы складываются в расчёт без формул"]},
   {t:"Как обрабатываете заявки и заказы?",o:[["в CRM, всё автоматически",0],["вручную в таблице",2],["в мессенджерах, без системы",3.5],["часть теряется",5]],tip:["Заявки в одной системе","Заказы из сайта, мессенджеров и звонков собираются в одном месте со статусом"]},
   {t:"Как вы узнаёте, что происходит в бизнесе: выручка, смены, проблемы?",o:[["вижу в панели",0],["собираю отчёты сам",2],["звоню управляющим",3],["узнаю, когда уже поздно",4]],tip:["Отчёт владельцу каждое утро","Главные цифры по всем точкам приходят в Telegram без звонков"]},
  ]},
};

const S = {step:"start", who:null, i:0, ans:[], rate:null};
const app = document.getElementById("app");
const head = (tag) => `<header><div class="logo">nova${STAR}</div><span class="tag">${tag}</span></header>`;
const fmt = (n) => Math.round(n).toLocaleString("ru-RU");

function render(){
  const s = S.step;
  if(s==="start"){
    app.innerHTML = head("тест · 1 минута") + `
    <section class="card fade" style="display:flex;flex-direction:column;gap:18px">
      <h1>Сколько вашей работы может делать система?</h1>
      <p class="mute">6 коротких вопросов. В конце — сколько часов в неделю у вас уходит на ручную рутину, во что это обходится в месяц и какие 3 задачи можно отдать системе первыми.</p>
      <div class="list">
        <div class="item"><span class="n">↳</span><div><b>для себя</b><p>фриланс, своё дело, личные задачи</p></div></div>
        <div class="item"><span class="n">↳</span><div><b>блог или эксперт</b><p>директ, заявки, консультации, контент</p></div></div>
        <div class="item"><span class="n">↳</span><div><b>бизнес с сотрудниками</b><p>смены, зарплаты, заявки, отчёты</p></div></div>
      </div>
    </section>
    <button class="btn fade" id="go">Пройти тест</button>
    <footer><p class="small">NOVA — системы учёта и автоматизации</p></footer>`;
    document.getElementById("go").onclick = ()=>{S.step="who";render();};
    return;
  }
  if(s==="who"){
    app.innerHTML = head("шаг 1 из 7") + `
    <section class="card fade" style="display:flex;flex-direction:column;gap:18px">
      <h2>Для чего проходите тест?</h2>
      <div class="opts" role="group" aria-label="Кто вы">
        ${[["self","Для себя","фриланс, своё дело, личные задачи"],["blog","Блог или эксперт","директ, заявки, консультации"],["biz","Бизнес с сотрудниками","смены, зарплаты, заявки, отчёты"]].map((o,k)=>`<button class="opt" id="who-${o[0]}" data-v="${o[0]}" aria-pressed="false"><span class="k">${"ABC"[k]}</span><span class="t">${o[1]}<small>${o[2]}</small></span></button>`).join("")}
      </div>
    </section>
    <div class="nav"><button class="btn ghost" id="back">Назад</button></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.who=b.dataset.v;S.i=0;S.ans=[];S.rate=null;b.setAttribute("aria-pressed","true");setTimeout(()=>{S.step="q";render();},180);});
    document.getElementById("back").onclick=()=>{S.step="start";render();};
    return;
  }
  if(s==="q"){
    const set = Q[S.who]; const list = [...set.qs, set.rateQ]; const total = list.length; const q = list[S.i];
    const chosen = S.i < set.qs.length ? S.ans[S.i] : S.rate;
    app.innerHTML = head(set.label) + `
    <div class="prog"><div class="bar"><i style="width:${((S.i+1)/(total+1))*100}%"></i></div><span>${S.i+2} / ${total+1}</span></div>
    <section class="card fade" style="display:flex;flex-direction:column;gap:18px">
      <h2>${q.t}</h2>
      <div class="opts" role="group" aria-label="Варианты ответа">
        ${q.o.map((o,k)=>`<button class="opt" id="q${S.i}-${k}" data-k="${k}" aria-pressed="${chosen===k}"><span class="k">${"ABCD"[k]}</span><span class="t">${o[0]}</span></button>`).join("")}
      </div>
    </section>
    <div class="nav"><button class="btn ghost" id="back">Назад</button></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true");
      if(S.i < set.qs.length) S.ans[S.i]=k; else S.rate=k;
      setTimeout(()=>{ if(S.i < total-1){S.i++;} else {S.step="result";} render(); window.scrollTo({top:0,behavior:"smooth"}); },200);
    });
    document.getElementById("back").onclick=()=>{ if(S.i>0){S.i--;} else {S.step="who";} render(); };
    return;
  }
  if(s==="result"){
    const set = Q[S.who];
    let mult = 1, week = 0; const scored = [];
    set.qs.forEach((q,idx)=>{ const v=q.o[S.ans[idx]][1]; if(q.mult){mult=v;return;} week+=v; if(q.tip) scored.push({v,tip:q.tip}); });
    week *= mult;
    const month = week*4.3;
    const rate = set.rateQ.o[S.rate][1];
    const money = month*rate;
    scored.sort((a,b)=>b.v-a.v);
    const top = scored.slice(0,3);
    const low = week < 2;
    app.innerHTML = head("ваш результат") + `
    <section class="card fade" style="display:flex;flex-direction:column;gap:16px">
      <p class="mute">системе можно отдать примерно</p>
      <div class="big">${fmt(week)}&nbsp;ч</div>
      <p style="font-size:18px;font-weight:500;margin-top:-6px">в неделю ручной работы</p>
      <div class="stats">
        <div class="stat"><b>≈${fmt(month)} ч</b><span>в месяц</span></div>
        <div class="stat"><b>≈${fmt(money)}&nbsp;₽</b><span>в месяц стоит это время</span></div>
      </div>
      <p class="small">Это оценка по вашим ответам: часы × ${set.label==="бизнес с сотрудниками"?"стоимость часа сотрудника":"стоимость вашего часа"}. Точный расчёт — на разборе.</p>
    </section>
    <section class="card fade" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="font-size:22px">${low?"У вас уже неплохой порядок. Что ещё можно улучшить:":"С чего начать в первую очередь"}</h2>
      <div class="list">${top.map((t,k)=>`<div class="item"><span class="n">0${k+1}</span><div><b>${t.tip[0]}</b><p>${t.tip[1]}</p></div></div>`).join("")}</div>
    </section>
    <section class="cta fade">
      <h2 style="color:inherit">Хотите, разберём это на вашем примере?</h2>
      <p style="opacity:.8">Бесплатный аудит: посмотрим ваши процессы, покажем, что можно автоматизировать, и посчитаем, сколько часов и денег это вернёт.</p>
      <a class="word" id="dm" href="https://ig.me/m/${IG_NICK}" target="_blank" rel="noopener" style="text-decoration:none"><span>Написать «${WORD}»</span><span style="font-size:14px;font-weight:500;letter-spacing:0;border-radius:999px;padding:12px 16px;background:var(--ink);color:var(--ink-fg)">в директ →</span></a>
      <p id="dmnote" style="opacity:.8;font-size:15px">Откроется чат с NOVA в Instagram, слово «${WORD}» скопируется само — вставьте его и отправьте.</p>
    </section>
    <button class="btn ghost" id="again">Пройти заново</button>`;
    document.getElementById("again").onclick=()=>{S.step="start";S.who=null;render();};
    const dm=document.getElementById("dm");
    dm.onclick=()=>{ try{ navigator.clipboard.writeText(WORD).catch(()=>{}); }catch(e){} };
    const cb=null;
    if(cb) cb.onclick=()=>{ const done=()=>{cb.textContent="Скопировано";}; try{ navigator.clipboard.writeText(WORD).then(done).catch(()=>{cb.textContent="Выделите слово";}); }catch(e){cb.textContent="Выделите слово";} };
  }
}
render();
</script>
